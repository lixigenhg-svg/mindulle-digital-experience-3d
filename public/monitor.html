<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>민들레 4D 체험관 · 운영 모니터</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312100e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23c9a227'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#12100e; --ink2:#1b1815; --line:#312b23;
    --paper:#f2ece1; --dim:#9a9186;
    --gold:#c9a227; --ok:#3f7f5a; --warn:#b4692a; --bad:#a33b30;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink); color:var(--paper);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:32px 24px 48px;
    display:flex; flex-direction:column; gap:28px;
    min-height:100vh;
  }
  header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:12px}
  .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,#d8b34a,#a8842a);flex:0 0 auto}
  h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .sub{font-size:12.5px;color:var(--dim);margin-top:3px;letter-spacing:.02em}
  .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 3px rgba(163,59,48,.16)}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(63,127,90,.18)}

  main{display:flex;flex-direction:column;gap:26px;flex:1}

  .hero{
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:26px 0 22px;
    display:flex; align-items:flex-end; gap:26px; flex-wrap:wrap;
  }
  .big{
    font-size:clamp(64px,13vw,132px); line-height:.86; font-weight:800;
    letter-spacing:-.05em; font-variant-numeric:tabular-nums;
    color:var(--paper);
  }
  .big small{font-size:clamp(18px,2.5vw,24px);font-weight:600;color:var(--dim);margin-left:8px;letter-spacing:0}
  .cap{font-size:13px;color:var(--dim);padding-bottom:8px;line-height:1.7}
  .cap b{display:block;color:var(--paper);font-size:14px;font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
  .cell{background:var(--ink2);padding:18px 16px 16px}
  .k{font-size:11.5px;color:var(--dim);letter-spacing:.04em}
  .v{font-size:28px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .v.u{font-size:13px;font-weight:600;line-height:1.6;color:var(--paper);word-break:break-all}

  .panel{border:1px solid var(--line);background:var(--ink2)}
  .phead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
  .phead h2{font-size:13px;font-weight:600;letter-spacing:.02em}
  .phead span{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  ul{list-style:none}
  li{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:13px 16px;border-bottom:1px solid var(--line)}
  li:last-child{border-bottom:0}
  .who{font-size:14px;font-weight:600}
  .msg{grid-column:1/-1;font-size:12.5px;color:var(--dim);line-height:1.55}
  .when{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .empty{padding:22px 16px;font-size:13px;color:var(--dim)}

  footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dim);border-top:1px solid var(--line);padding-top:16px}
  .err{color:var(--warn)}

  @media (max-width:820px){
    body{padding:20px 16px 32px;gap:22px}
    .grid{grid-template-columns:repeat(2,1fr)}
    .hero{padding:20px 0 18px;gap:18px}
    .big{font-size:clamp(56px,18vw,88px)}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark"></div>
    <div>
      <h1>민들레 4D 체험관</h1>
      <div class="sub">운영 모니터 · mindulle.kr/3d</div>
    </div>
  </div>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="stateText">확인 중</span>
  </div>
</header>

<main>
  <section class="hero">
    <div class="big"><span id="online">--</span><small>/ <span id="capacity">--</span></small></div>
    <div class="cap">
      <b>현재 접속 인원</b>
      실시간 세션 기준 · 15초마다 갱신
    </div>
  </section>

  <section class="grid">
    <div class="cell"><div class="k">열린 방</div><div class="v" id="rooms">–</div></div>
    <div class="cell"><div class="k">총 수용 인원</div><div class="v" id="peakCap">–</div></div>
    <div class="cell"><div class="k">오늘 최고</div><div class="v" id="peak">–</div></div>
    <div class="cell"><div class="k">가동 시간</div><div class="v" id="uptime">–</div></div>
    <div class="cell"><div class="k">누적 입장</div><div class="v" id="joins">–</div></div>
    <div class="cell"><div class="k">거절된 연결</div><div class="v" id="rejected">–</div></div>
    <div class="cell"><div class="k">끊긴 세션</div><div class="v" id="dropped">–</div></div>
    <div class="cell"><div class="k">메모리</div><div class="v" id="rss">–</div></div>
  </section>

  <section class="panel">
    <div class="phead">
      <h2>최근 라이트 명패</h2>
      <span id="lampCount">–</span>
    </div>
    <ul id="lampList"><li class="empty">불러오는 중</li></ul>
  </section>
</main>

<footer>
  <span id="stamp">마지막 갱신 —</span>
  <span>15초 자동 갱신 · 로컬에서 열면 데이터가 보이지 않습니다. mindulle.kr/3d/ 에 올린 뒤 확인하세요.</span>
</footer>

<script>
(function () {
  var WS = 'https://mindulle.kr/ws-health';
  var LAMP = 'https://mindulle.kr/care/lamp-list.php';
  var $ = function (id) { return document.getElementById(id); };

  function uptimeText(sec) {
    if (typeof sec !== 'number') return '—';
    var d = Math.floor(sec / 86400);
    var h = Math.floor((sec % 86400) / 3600);
    var m = Math.floor((sec % 3600) / 60);
    if (d > 0) return d + '일 ' + h + '시간';
    if (h > 0) return h + '시간 ' + m + '분';
    return m + '분';
  }

  function stamp() {
    var t = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    $('stamp').textContent = '마지막 갱신 ' + p(t.getHours()) + ':' + p(t.getMinutes()) + ':' + p(t.getSeconds());
  }

  function setState(ok) {
    $('dot').className = ok ? 'dot on' : 'dot';
    $('stateText').textContent = ok ? '서비스 정상' : '연결 실패';
    $('stateText').className = ok ? '' : 'err';
  }

  function loadHealth() {
    return fetch(WS, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (d) {
        setState(d.ok === true);
        $('online').textContent = d.online != null ? d.online : '--';
        $('capacity').textContent = d.capacity != null ? d.capacity : '--';
        $('rooms').textContent = d.rooms != null ? d.rooms : '—';
        $('peakCap').textContent = d.totalSeats != null ? Number(d.totalSeats).toLocaleString() + '석'
          : (d.capacity != null ? d.capacity + '명' : '—');
        $('peak').textContent = d.peak != null ? d.peak + '명' : '—';
        $('uptime').textContent = uptimeText(d.uptimeSec);
        $('joins').textContent = d.joins != null ? d.joins : '—';
        $('rejected').textContent = d.rejected != null ? d.rejected : '—';
        $('dropped').textContent = d.dropped != null ? d.dropped : '—';
        $('rss').textContent = d.rssMB != null ? d.rssMB + ' MB' : '—';
      })
      .catch(function () {
        setState(false);
        ['online', 'capacity'].forEach(function (k) { $(k).textContent = '--'; });
        ['rooms', 'peakCap', 'peak', 'uptime', 'joins', 'rejected', 'dropped', 'rss']
          .forEach(function (k) { $(k).textContent = '—'; });
      });
  }

  function loadLamps() {
    return fetch(LAMP + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (d) {
        var list = $('lampList');
        var arr = (d && d.lamps) ? d.lamps : [];
        $('lampCount').textContent = (d && d.count != null ? d.count : arr.length) + '건';
        if (!arr.length) {
          list.innerHTML = '<li class="empty">등록된 명패가 없습니다</li>';
          return;
        }
        list.innerHTML = arr.slice(0, 5).map(function (x) {
          var msg = (x.message || '').replace(/[<>]/g, '');
          var who = (x.name || '—').replace(/[<>]/g, '');
          var when = (x.date || '').slice(0, 10);
          return '<li><div class="who">' + who + '</div><div class="when">' + when + '</div>' +
                 (msg ? '<div class="msg">' + msg + '</div>' : '') + '</li>';
        }).join('');
      })
      .catch(function () {
        $('lampCount').textContent = '—';
        $('lampList').innerHTML = '<li class="empty">명패를 불러오지 못했습니다</li>';
      });
  }

  function tick() {
    Promise.all([loadHealth(), loadLamps()]).then(stamp);
  }

  tick();
  setInterval(tick, 15000);
})();
</script>
</body>
</html>
